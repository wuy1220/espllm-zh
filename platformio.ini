; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m3m.ld
; 4 MB chip, but irom0_0_seg caps directly-addressable code/rodata at 1 MB
; (0x40201010..0x40300000), so no ldscript can make the code region bigger.
; What the ldscript *does* control is whether the other 3 MB exist at all:
; eagle.flash.4m.ld leaves spiffs at 0 B, eagle.flash.4m3m.ld gives
; 3,121,152 B at 0x40300000. Measured with bench_fs/: code region unchanged
; (same irom0_0_seg, same EEPROM offset), LittleFS random 1.6 KB read = 435 us,
; raw ESP.flashRead = 198 us, ppm-read_dword over PROGMEM = 112 us.
board_build.flash_mode = qio
build_flags = 
    -O3
    -DESP8266_BOARD
; 构建前闸门：model_weights.hpp 的常量必须与它自报的架构一致（见 extra_scripts.py）
extra_scripts = pre:extra_scripts.py
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -O3
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_s3_16MB.csv
build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DESP32S3_BOARD
upload_speed = 921600
monitor_speed = 115200

